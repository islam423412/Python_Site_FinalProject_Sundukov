<!-- templates/registration/login.html -->
{% extends 'ads/base.html' %}

{% block title %}Вход в систему{% endblock %}

{% block content %}
    <h2>Вход</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }} <!-- Автоматически выведет поля для логина и пароля -->
        <button type="submit" class="btn btn-primary">Войти</button>
    </form>
{% endblock %}
